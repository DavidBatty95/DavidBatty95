<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Geoff-Sim — Perceive. Pick up. Walk. Deliver.</title>
<desc id="desc">Sensor-driven humanoid locomanipulation.. RGB-D pickup, loaded walking and human-aware. planning in one inspectable research platform.. Workflow: Observe + map, Approach + dock, Pick up + carry, Place + verify. Original illustrative schematic, not recorded robot motion or live measurements.</desc>
