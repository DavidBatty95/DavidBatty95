<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Skele-Tracker — Movement, models and muscle-driven simulation</title>
<desc id="desc">Current research connecting captured human movement to anatomical simulation and interpretable biomechanics. An illustrative joint skeleton, muscle paths and signal traces; not participant data or clinical validation.</desc>
