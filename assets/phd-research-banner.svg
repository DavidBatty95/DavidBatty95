    <text x="44" y="160" font-size="42" font-weight="bold" fill="#f0f6fc">robotic exploration</text>
    <text x="44" y="207" font-size="20" fill="#c3d5e5">Mapping, inference and planning for unknown</text>
    <text x="44" y="237" font-size="20" fill="#c3d5e5">hazardous nuclear environments.</text>
    <text x="44" y="279" font-size="16" fill="#80bfff">Dr David Batty · University of Liverpool · 2026</text>
