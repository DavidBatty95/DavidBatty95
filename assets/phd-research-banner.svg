<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">PhD Research — Radiation-aware robotic exploration</title>
  <desc id="desc">University of Liverpool, 2026. Mapping, inference and planning for unknown hazardous nuclear environments. A schematic shows a robot route through a mapped environment around a radiation field. Read the thesis.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102536"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <radialGradient id="field">
      <stop stop-color="#ffb454" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#80bfff" stroke-opacity="0.1"/>
