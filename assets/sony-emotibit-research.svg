  </g>
  <text x="155" y="204" text-anchor="middle" fill="#aac3d4" font-family="DejaVu Sans,Arial,sans-serif" font-size="11">SCHEMATIC / NOT EXPERIMENTAL DATA</text>
 </g>
</svg>
