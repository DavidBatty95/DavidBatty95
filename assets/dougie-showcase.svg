<title id="title">Dougie-Sim — Explore the unknown. Budget the way home.</title>
<desc id="desc">Quadruped exploration with radiation constraints.. Online Gaussian process mapping, observed. terrain and dose-aware return reasoning.. Workflow: Sense + explore, Infer the field, Plan with dose, Return home. Original illustrative schematic, not recorded robot motion or live measurements.</desc>
