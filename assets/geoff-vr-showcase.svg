<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Geoff-Sim-VR — Your reach. Two arms. One virtual workspace.</title>
<desc id="desc">Illustrated Meta Quest headset and tracked controllers linked to two fixed-base G1 robot arms at a virtual workbench. Track and clutch, map wrist pose, move G1 arms, and stream stereo. Original schematic, not a recording from a headset or physical robot.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091725"/><stop offset="1" stop-color="#242b49"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#bea7ff"/><stop offset="1" stop-color="#1b3b50"/></linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#37465f" stroke-width=".6"/></pattern>
</defs>
<style>
  text {font-family:Segoe UI,Helvetica,Arial,sans-serif}
  .body {fill:#bdcfdd;font-size:21px} .step {fill:#eaf3fa;font-size:19px;font-weight:650}
  .number {fill:#bea7ff;font-size:16px;font-weight:700} .label {fill:#a9bfce;font-size:12px;letter-spacing:1px}
  .flow {stroke-dasharray:7 9;animation:flow 4s linear infinite}
  .pulse {animation:pulse 4s ease-in-out infinite}
  @keyframes flow {to {stroke-dashoffset:-64}}
  @keyframes pulse {50% {opacity:.45}}
  @media(prefers-reduced-motion:reduce) {* {animation:none!important}}
</style>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#39465e"/>
<path d="M24 1H1176" stroke="url(#edge)" stroke-width="3"/>
<rect x="644" y="20" width="534" height="282" fill="url(#grid)" opacity=".32"/>
<text x="46" y="48" fill="#bea7ff" font-size="13" font-weight="750" letter-spacing="2.3">03 / IMMERSIVE TELEOPERATION</text>
<text x="42" y="124" fill="#f3f8fc" font-size="61" font-weight="800" letter-spacing="-2">Geoff-Sim-VR</text>
<text x="46" y="160" fill="#bea7ff" font-size="23" font-weight="600">Your reach. Two arms. One virtual workspace.</text>
<text x="46" y="192" class="body">Quest controllers or hands drive G1 arms.</text>
<text x="46" y="222" class="body">Grip or pinch to follow. Release to hold.</text>
<text x="46" y="252" class="body">Stereo MuJoCo views close the visual loop.</text>
