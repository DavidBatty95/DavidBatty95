    <text x="44" y="177" fill="#f1f5f9" font-size="72" font-weight="700" letter-spacing="-2">David Batty</text>
    <text x="48" y="226" fill="#cbd5e1" font-size="23">From radiation-aware exploration</text>
    <text x="48" y="259" fill="#cbd5e1" font-size="23">to human-aware robots.</text>
    <text x="48" y="316" fill="#91a9bd" font-size="15" letter-spacing="1.5">RESEARCH  ·  SIMULATION  ·  REAL-WORLD SYSTEMS</text>
